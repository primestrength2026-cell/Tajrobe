<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luxe Beauty by Maro // Haute Esthétique & Skincare Lounge</title>
    
    <!-- Premium Google Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&family=Cairo:wght@300;500;700&display=swap" rel="stylesheet">
    
    <!-- GSAP Premium Animation CDNs -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <style>
        /* ==================================================
           AWARDS-WINNING EMULSION DESIGN SYSTEM (THEMING)
           ================================================== */
        :root {
            --bg-pure: #ffffff;
            --bg-cream: #faf7f2;
            --gold-primary: #d4af37;
            --gold-dark: #aa841b;
            --gold-gloss: linear-gradient(135deg, #f3e7c4 0%, #d4af37 50%, #aa841b 100%);
            --gold-glow: rgba(212, 175, 55, 0.2);
            --text-main: #1a1a1a;
            --text-muted: #666666;
            --font-serif: 'Cinzel', serif;
            --font-sans: 'Montserrat', sans-serif;
            --font-arabic: 'Cairo', sans-serif;
            --border-glass: rgba(212, 175, 55, 0.15);
            --shadow-premium: 0 30px 60px rgba(212, 175, 55, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-font-smoothing: antialiased;
        }

        html, body {
            background-color: var(--bg-pure);
            color: var(--text-main);
            font-family: var(--font-sans);
            overflow-x: hidden;
            scroll-behavior: smooth;
        }

        /* Subtle Luxury Silk Shimmer Canvas Overlay */
        .luxury-grain {
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 100vh;
            opacity: 0.015;
            pointer-events: none;
            z-index: 9999;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.8' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        /* Scrollbar customization */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: var(--bg-cream);
        }
        ::-webkit-scrollbar-thumb {
            background: var(--gold-primary);
            border-radius: 4px;
        }

        /* RTL/Arabic Context Optimization overrides */
        [lang="ar"] {
            font-family: var(--font-arabic);
        }
        [lang="ar"] .serif-text, [lang="ar"] h1, [lang="ar"] h2, [lang="ar"] h3, [lang="ar"] h4 {
            font-family: var(--font-arabic);
            font-weight: 700;
        }
        [lang="ar"] nav a {
            font-family: var(--font-arabic);
        }

        /* ==================================================
           3D/2D INTERACTIVE LIQUID LIGHT LAYER
           ================================================== */
        #interactive-3d-canvas {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow-sphere {
            position: fixed;
            width: 700px; height: 700px;
            background: radial-gradient(circle, rgba(243,231,196,0.3) 0%, rgba(255,255,255,0) 70%);
            top: -200px; right: -200px;
            pointer-events: none;
            z-index: 2;
            filter: blur(100px);
        }

        /* ==================================================
           PRELOADER SCREEN
           ================================================== */
        .preloader {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: var(--bg-cream);
            z-index: 10000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .preloader-logo {
            width: 180px;
            height: 180px;
            opacity: 0;
            transform: scale(0.9);
            margin-bottom: 30px;
        }
        .preloader-line {
            width: 200px; height: 1px;
            background: rgba(214, 175, 55, 0.2);
            position: relative;
            overflow: hidden;
        }
        .preloader-bar {
            position: absolute;
            height: 100%; width: 0%;
            background: var(--gold-primary);
            left: 0; top: 0;
        }

        /* ==================================================
           EXQUISITE HEADER / NAV SYSTEMS
           ================================================== */
        header {
            position: fixed;
            top: 0; left: 0; width: 100%;
            padding: 25px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            background: rgba(255, 255, 255, 0.85);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border-bottom: 1px solid rgba(214, 175, 55, 0.08);
            transition: all 0.4s ease;
        }
        header.scrolled {
            padding: 15px 6%;
            box-shadow: 0 10px 40px rgba(0,0,0,0.02);
        }
        .logo-container {
            display: flex;
            align-items: center;
            gap: 15px;
            text-decoration: none;
        }
        .brand-logo-img {
            height: 55px;
            width: auto;
            object-fit: contain;
            transition: transform 0.4s ease;
        }
        .logo-container:hover .brand-logo-img {
            transform: rotate(5deg) scale(1.05);
        }
        .brand-name {
            font-family: var(--font-serif);
            font-size: 1.25rem;
            letter-spacing: 3px;
            color: var(--text-main);
            text-transform: uppercase;
            font-weight: 600;
        }
        .brand-name span {
            display: block;
            font-size: 0.65rem;
            letter-spacing: 5px;
            color: var(--gold-dark);
            margin-top: 4px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 40px;
        }
        nav a {
            color: var(--text-main);
            text-decoration: none;
            font-size: 0.8rem;
            letter-spacing: 2px;
            font-weight: 500;
            text-transform: uppercase;
            position: relative;
            padding: 5px 0;
            transition: color 0.3s ease;
        }
        nav a::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0; width: 0%; height: 1px;
            background: var(--gold-primary);
            transition: width 0.3s ease;
        }
        nav a:hover::after {
            width: 100%;
        }
        
        /* Language switcher configuration */
        .lang-switch {
            background: transparent;
            border: 1px solid var(--gold-primary);
            padding: 8px 18px;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            color: var(--text-main);
        }
        .lang-switch:hover {
            background: var(--gold-primary);
            color: white;
            box-shadow: 0 5px 15px var(--gold-glow);
        }

        /* ==================================================
           HERO SECTION (3D LUXURY EMULSION REVEAL)
           ================================================== */
        .hero-section {
            min-height: 100vh;
            width: 100%;
            position: relative;
            display: flex;
            align-items: center;
            padding: 0 8%;
            background: radial-gradient(circle at 80% 50%, var(--bg-cream) 0%, var(--bg-pure) 70%);
            z-index: 3;
            overflow: hidden;
        }
        .hero-grid {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            width: 100%;
            align-items: center;
            gap: 60px;
            margin-top: 80px;
        }
        .hero-content {
            z-index: 5;
            opacity: 0;
            transform: translateY(40px);
        }
        .hero-tagline {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 6px;
            color: var(--gold-dark);
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .hero-tagline::before {
            content: '';
            width: 30px; height: 1px;
            background: var(--gold-primary);
        }
        .hero-title {
            font-family: var(--font-serif);
            font-size: clamp(2.5rem, 5vw, 4.8rem);
            font-weight: 400;
            line-height: 1.1;
            color: var(--text-main);
            margin-bottom: 35px;
        }
        .hero-title em {
            font-family: var(--font-sans);
            font-style: normal;
            font-weight: 300;
            color: var(--text-muted);
        }
        .hero-desc {
            font-size: 1.05rem;
            color: var(--text-muted);
            max-width: 580px;
            line-height: 1.8;
            margin-bottom: 45px;
            font-weight: 300;
        }
        
        /* Interactive 3D Holographic Token Image Container */
        .hero-artwork {
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 4;
            perspective: 1200px;
        }
        .artwork-orbit-frame {
            width: 100%;
            max-width: 480px;
            aspect-ratio: 1;
            background: var(--bg-pure);
            border-radius: 50%;
            border: 1px solid rgba(214, 175, 55, 0.15);
            padding: 30px;
            box-shadow: var(--shadow-premium);
            transform-style: preserve-3d;
            transition: transform 0.1s ease-out;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .artwork-orbit-frame::before {
            content: '';
            position: absolute;
            inset: -15px;
            border-radius: 50%;
            border: 1px dashed rgba(214, 175, 55, 0.25);
            animation: spin 60s linear infinite;
        }
        .main-embedded-logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 50%;
            background: #ffffff;
            filter: drop-shadow(0 15px 30px rgba(0,0,0,0.03));
            transform: translateZ(30px);
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        /* ==================================================
           SERVICES / ARCHITECTURE MATRIX SECTION
           ================================================== */
        .services-section {
            padding: 160px 8%;
            background: var(--bg-pure);
            position: relative;
            z-index: 5;
        }
        .section-intro {
            text-align: center;
            max-width: 700px;
            margin: 0 auto 90px auto;
        }
        .section-tag {
            font-size: 0.8rem;
            letter-spacing: 5px;
            text-transform: uppercase;
            color: var(--gold-dark);
            font-weight: 600;
            margin-bottom: 15px;
            display: block;
        }
        .section-title {
            font-family: var(--font-serif);
            font-size: clamp(2rem, 3.5vw, 3rem);
            font-weight: 400;
            color: var(--text-main);
        }
        .section-divider {
            width: 60px; height: 1px;
            background: var(--gold-primary);
            margin: 25px auto 0 auto;
        }

        .services-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 50px;
            max-width: 1300px;
            margin: 0 auto;
        }
        
        /* Exquisite High-End UI Cards with Glassmorphism and Glow Borders */
        .service-card {
            background: #ffffff;
            border: 1px solid rgba(214, 175, 55, 0.1);
            padding: 60px 50px;
            border-radius: 0px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 40px rgba(0,0,0,0.01);
            transition: all 0.5s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .service-card::before {
            content: '';
            position: absolute;
            top: 0; left: 0; width: 100%; height: 4px;
            background: var(--gold-gloss);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.5s ease;
        }
        .service-card:hover {
            transform: translateY(-10px);
            border-color: rgba(214, 175, 55, 0.3);
            box-shadow: var(--shadow-premium);
        }
        .service-card:hover::before {
            transform: scaleX(1);
        }

        .service-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 30px;
        }
        .service-icon-box {
            width: 50px; height: 50px;
            border: 1px solid var(--border-glass);
            display: flex;
            justify-content: center;
            align-items: center;
            color: var(--gold-primary);
        }
        .service-index {
            font-family: var(--font-serif);
            font-size: 0.9rem;
            color: var(--gold-primary);
            letter-spacing: 2px;
        }
        .service-title {
            font-family: var(--font-serif);
            font-size: 1.6rem;
            font-weight: 400;
            color: var(--text-main);
            margin-bottom: 20px;
            letter-spacing: 1px;
        }
        .service-desc {
            color: var(--text-muted);
            font-size: 0.95rem;
            line-height: 1.75;
            margin-bottom: 40px;
            font-weight: 300;
            flex-grow: 1;
        }

        /* Dynamic Premium WhatsApp Direct Booking CTA Module Button */
        .whatsapp-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            background: var(--text-main);
            color: #ffffff;
            text-decoration: none;
            padding: 16px 32px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: all 0.3s ease;
            border: 1px solid transparent;
            cursor: pointer;
            width: 100%;
        }
        .whatsapp-btn svg {
            width: 16px;
            height: 16px;
            fill: currentColor;
            transition: transform 0.3s ease;
        }
        .whatsapp-btn:hover {
            background: transparent;
            color: var(--gold-dark);
            border-color: var(--gold-primary);
            box-shadow: 0 10px 25px var(--gold-glow);
        }
        .whatsapp-btn:hover svg {
            transform: translateX(4px);
        }

        /* ==================================================
           PHILOSOPHY REVEAL OVERLAY BANNER
           ================================================== */
        .philosophy-section {
            padding: 140px 8%;
            background: var(--bg-cream);
            position: relative;
            z-index: 5;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .philosophy-container {
            max-width: 900px;
        }
        .philosophy-quote {
            font-family: var(--font-serif);
            font-size: clamp(1.5rem, 2.8vw, 2.5rem);
            line-height: 1.6;
            color: var(--text-main);
            margin-bottom: 35px;
            font-weight: 400;
        }

        /* ==================================================
           FOOTER SYMMETRY
           ================================================== */
        footer {
            background: #ffffff;
            padding: 80px 8% 40px 8%;
            border-top: 1px solid rgba(214, 175, 55, 0.08);
            position: relative;
            z-index: 5;
        }
        .footer-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 40px;
            margin-bottom: 60px;
            align-items: center;
        }
        .footer-col-center {
            text-align: center;
        }
        .footer-col-right {
            text-align: right;
        }
        .footer-title {
            font-family: var(--font-serif);
            font-size: 0.9rem;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 15px;
            color: var(--text-main);
        }
        .footer-text {
            color: var(--text-muted);
            font-size: 0.9rem;
            line-height: 1.6;
        }
        .footer-bottom {
            border-top: 1px solid rgba(0,0,0,0.05);
            padding-top: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.8rem;
            color: var(--text-muted);
            letter-spacing: 0.5px;
        }

        /* ==================================================
           HIGH END RESPONSIVE LAYOUT MATRIX (MOBILE FIRST)
           ================================================== */
        @media(max-width: 1024px) {
            .hero-grid {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 50px;
            }
            .hero-tagline {
                justify-content: center;
            }
            .hero-desc {
                margin: 0 auto 45px auto;
            }
            .hero-artwork {
                order: -1;
            }
            .services-grid {
                grid-template-columns: 1fr;
                gap: 35px;
            }
            .footer-grid {
                grid-template-columns: 1fr;
                text-align: center;
            }
            .footer-col-right {
                text-align: center;
            }
        }
        @media(max-width: 768px) {
            header {
                padding: 20px 5%;
            }
            .brand-name {
                font-size: 1.1rem;
            }
            .nav-actions nav {
                display: none; /* Immersive focus layout */
            }
            .service-card {
                padding: 40px 30px;
            }
        }
    </style>
</head>

    <div class="ambient-glow-sphere"></div>
